services:
  - type: web
    name: rumilcar-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: EMAIL_PROVIDER
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: redesmultiserviciosrumilcar@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: "Rumilcar App <redesmultiserviciosrumilcar@gmail.com>"
      - key: FRONTEND_URL
        value: https://rumilcarapp.vercel.app
      - key: PASSWORD_RESET_EXPIRES_MINUTES
        value: 15
      - key: PASSWORD_RESET_RATE_LIMIT_SECONDS
        value: 60

